name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS device
        run: |
          xcodebuild \
            -project HabitChecker.xcodeproj \
            -scheme HabitChecker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/HabitChecker.app" Payload/
          zip -r HabitChecker.ipa Payload

      - name: Upload .ipa as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitChecker-ipa
          path: HabitChecker.ipa
